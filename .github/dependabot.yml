# Dependabot keeps npm dependencies, pinned GitHub Actions and the Docker base
# image up to date.
# Action updates land as SHA bumps with the human-readable tag in a comment.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk dev tooling into a single PR. Majors stay out of the
      # group: each gets a PR of its own, so one breaking bump cannot hold
      # every minor and patch update back with it.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pinned exactly to the version actions/package.json vendors into the
      # single-page bundles (tests/artifact-checks.spec.js enforces the match),
      # so a root-only bump always fails. Bump both files together, by hand.
      - dependency-name: mermaid
      # @astrojs/check peers typescript ^5 || ^6; a major beyond that fails
      # `npm ci` with ERESOLVE. Lift once @astrojs/check accepts the next major.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The Dockerfile pins nginx-unprivileged by tag and digest; this bumps both.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
