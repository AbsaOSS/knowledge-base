# Reusable workflow — build a knowledge base deployment from someone else's registry.
#
# Deployment is deliberately not part of this repository. A private deployment
# repo owns the production registry (which docs repos, which versions), the cloud
# account and the schedule; this repo is the build tool it calls.
#
#   jobs:
#     build:
#       uses: AbsaOSS/knowledge-base/.github/workflows/build-image.yml@v1
#       with:
#         registry: apps.json          # in the CALLING repo
#         image-name: ghcr.io/org/knowledge-base
#         mcp-image-name: ghcr.io/org/knowledge-base-mcp   # optional: the MCP server
#       secrets:
#         docs-token: ${{ steps.app-token.outputs.token }}
#
# See contract/DEPLOYMENT.md for the repository layout, the GitHub App the token
# comes from, and the triggers a deployment repo should use.
name: Build knowledge base image

on:
  workflow_call:
    inputs:
      kb-ref:
        description: >-
          Ref of AbsaOSS/knowledge-base to build with. Pin this to a tag so a
          deployment is reproducible; defaults to the ref this workflow was
          called at.
        type: string
        required: false
        default: ''
      registry:
        description: 'Registry file in the CALLING repository (KB_REGISTRY).'
        type: string
        required: false
        default: apps.json
      headless:
        description: 'Produce web-fragment output. Standalone when false.'
        type: boolean
        required: false
        default: true
      strict:
        description: >-
          Reject prebuilt/localPath/optional entries and any entry that produces
          no apps. Leave on for a real deployment.
        type: boolean
        required: false
        default: true
      image-name:
        description: >-
          Image to build and push, e.g. ghcr.io/org/knowledge-base. When empty,
          dist/ is uploaded as a workflow artifact and nothing is pushed — which
          is what a dry run wants.
        type: string
        required: false
        default: ''
      mcp-image-name:
        description: >-
          MCP server image to build and push from the same dist/ and with the
          same tags, e.g. ghcr.io/org/knowledge-base-mcp. It runs beside the
          site image in one task; see contract/DEPLOYMENT.md. Empty builds no
          MCP image. Ignored without image-name.
        type: string
        required: false
        default: ''
      python-index:
        description: >-
          Python package index for the MCP image's dependencies, for runners
          that cannot reach pypi.org — an Artifactory PyPI remote, say. Empty
          means PyPI. The lockfile needs no change: the image installs from
          hash-pinned requirements exported from it, which name no index.
        type: string
        required: false
        default: ''
      image-tags:
        description: 'Newline- or comma-separated tags to push. Defaults to the calling run''s SHA.'
        type: string
        required: false
        default: ''
      registry-host:
        description: 'Container registry to log in to. Defaults to ghcr.io.'
        type: string
        required: false
        default: ghcr.io
      runs-on:
        description: >-
          Where to run the build: a single runner label, or a JSON array or
          object for anything more (`'["self-hosted", "linux"]'`,
          `'{"group": "internal"}'`). Defaults to ubuntu-latest.
        type: string
        required: false
        default: ubuntu-latest
      npm-registry:
        description: >-
          npm registry to install the build's dependencies from, for runners
          that cannot reach registry.npmjs.org — an Artifactory npm remote, say.
          Empty means whatever npm resolves on the runner. The lockfile needs
          no change: it names no registry, only versions and integrity hashes.
        type: string
        required: false
        default: ''
      node-mirror:
        description: >-
          Mirror of https://nodejs.org to download Node from, for runners that
          can reach neither nodejs.org nor the github.com release assets
          `setup-node` tries first. Not needed when the runner image already
          carries Node in its tool cache.
        type: string
        required: false
        default: ''
    secrets:
      docs-token:
        description: >-
          Token with `contents: read` on every registered docs repo. Mint it from
          a GitHub App installation rather than using a personal token — see
          contract/DEPLOYMENT.md.
        required: false
      registry-username:
        required: false
      registry-password:
        required: false
      npm-token:
        description: >-
          Bearer token for `npm-registry`. Leave unset for a registry that
          allows anonymous reads.
        required: false
      node-mirror-token:
        description: Authorization header value for `node-mirror`.
        required: false
      python-index-username:
        description: User name for `python-index`, when it needs credentials.
        required: false
      python-index-token:
        description: >-
          Password or token for `python-index`. Reaches the image build as a
          BuildKit secret, never as a build argument or a layer.
        required: false
      ca-certificates:
        description: >-
          Extra CA certificates (PEM) the image build trusts while `apk upgrade`
          fetches Alpine fixes — a TLS-intercepting proxy's CA, say. Written
          to trusted_certs/ before `docker build`; see the Dockerfile.
        required: false
    outputs:
      image:
        description: 'The first pushed image reference, when one was pushed.'
        value: ${{ jobs.build.outputs.image }}
      mcp-image:
        description: 'The first pushed MCP image reference, when one was pushed.'
        value: ${{ jobs.build.outputs.mcp-image }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    # A label is used as it is; anything starting with `[` or `{` is parsed, so
    # a caller can name several labels or a runner group. `&&`/`||` short-circuit,
    # so fromJSON never sees a bare label.
    runs-on: ${{ (startsWith(inputs.runs-on, '[') || startsWith(inputs.runs-on, '{')) && fromJSON(inputs.runs-on) || inputs.runs-on }}
    outputs:
      image: ${{ steps.push.outputs.image }}
      mcp-image: ${{ steps.push.outputs.mcp-image }}
    steps:
      # The caller's repo holds the registry; this repo holds the build. They are
      # checked out side by side, and the build runs from this one.
      - name: Check out the deployment repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deployment

      - name: Check out the knowledge base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AbsaOSS/knowledge-base
          ref: ${{ inputs.kb-ref }}
          path: knowledge-base

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: knowledge-base/package-lock.json
          mirror: ${{ inputs.node-mirror }}
          mirror-token: ${{ secrets.node-mirror-token }}

      # Same mechanism as the publishing actions (actions/lib/npm-registry.sh):
      # project-level npm config appended next to the lockfile, applied to this
      # install and nothing else. Inlined rather than run from the checkout so that a
      # caller pinning an older kb-ref still gets the registry it asked for.
      - name: Point npm at a private registry
        if: ${{ inputs.npm-registry != '' }}
        working-directory: knowledge-base
        env:
          KB_NPM_REGISTRY: ${{ inputs.npm-registry }}
          KB_NPM_TOKEN: ${{ secrets.npm-token }}
        run: |
          set -euo pipefail
          case "$KB_NPM_REGISTRY" in
            *[[:space:]]*)
              echo "::error::npm-registry must be a single URL with no whitespace, got '$KB_NPM_REGISTRY'"
              exit 1 ;;
            http://*|https://*) ;;
            *)
              echo "::error::npm-registry must be an http(s) URL, got '$KB_NPM_REGISTRY'"
              exit 1 ;;
          esac
          registry="${KB_NPM_REGISTRY%/}/"
          {
            echo "registry=${registry}"
            # A reference npm expands at run time, so the token never lands on disk.
            if [ -n "${KB_NPM_TOKEN:-}" ]; then
              echo "${registry#*:}:_authToken=\${KB_NPM_TOKEN}"
            fi
          } >> .npmrc
          echo "npm installs from ${registry}${KB_NPM_TOKEN:+ (authenticated)}"

      - name: Install
        working-directory: knowledge-base
        env:
          KB_NPM_TOKEN: ${{ secrets.npm-token }}
        run: npm ci

      - name: Resolve the registry
        id: registry
        env:
          KB_REGISTRY_INPUT: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/deployment/$KB_REGISTRY_INPUT"
          if [ ! -f "$src" ]; then
            echo "::error::Registry not found in the calling repository: $KB_REGISTRY_INPUT"
            exit 1
          fi
          # An absolute path: the registry belongs to the calling repository and
          # is checked out beside this one, not inside it. Both the orchestrator
          # and Astro resolve KB_REGISTRY the same way, so they read one file.
          echo "path=$src" >> "$GITHUB_OUTPUT"
          echo "Registry: $KB_REGISTRY_INPUT"
          cat "$src"

      - name: Build
        working-directory: knowledge-base
        env:
          KB_REGISTRY: ${{ steps.registry.outputs.path }}
          KB_HEADLESS: ${{ inputs.headless }}
          KB_STRICT: ${{ inputs.strict }}
          # Always a token, so the fetch never falls back to the gh CLI, which a
          # self-hosted runner need not have. github.token covers public
          # docs repos; private ones need docs-token.
          GITHUB_TOKEN: ${{ secrets.docs-token || github.token }}
          # The docs repos and the registry are the only things a build should
          # talk to. Matters on a runner whose egress is a short allowlist.
          ASTRO_TELEMETRY_DISABLED: '1'
        run: node scripts/build-vite.js ${{ inputs.headless && '--headless' || '' }}

      # Without an image name this is a dry run: prove the registry builds, keep
      # the output, push nothing.
      - name: Upload dist
        if: ${{ inputs.image-name == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: knowledge-base/dist/
          retention-days: 7

      - name: Log in to the container registry
        if: ${{ inputs.image-name != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry-host }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || github.token }}
          # The password is already a resolved credential (an ECR authorization
          # token minted by the caller, or a PAT/GITHUB_TOKEN) — not an IAM
          # access key. login-action's ECR auto-detection (default) treats
          # username/password as accessKeyId/secretAccessKey and calls AWS
          # itself, which fails for any registry-host that looks like ECR.
          # Force the plain `docker login` path instead.
          ecr: 'false'

      - name: Build and push the images
        id: push
        if: ${{ inputs.image-name != '' }}
        working-directory: knowledge-base
        env:
          KB_IMAGE: ${{ inputs.image-name }}
          KB_MCP_IMAGE: ${{ inputs.mcp-image-name }}
          KB_TAGS: ${{ inputs.image-tags }}
          KB_SHA: ${{ github.sha }}
          KB_CA_CERTIFICATES: ${{ secrets.ca-certificates }}
          KB_PYTHON_INDEX: ${{ inputs.python-index }}
          KB_PYTHON_INDEX_USERNAME: ${{ secrets.python-index-username }}
          KB_PYTHON_INDEX_TOKEN: ${{ secrets.python-index-token }}
        run: |
          set -euo pipefail

          # Both Dockerfiles trust every *.pem in trusted_certs/ for their
          # package downloads.
          if [ -n "${KB_CA_CERTIFICATES:-}" ]; then
            printf '%s\n' "$KB_CA_CERTIFICATES" > trusted_certs/ca-certificates.pem
          fi

          tags="${KB_TAGS:-$KB_SHA}"
          # Accept either separator; normalise to one tag per line.
          tags="$(printf '%s' "$tags" | tr ',' '\n' | sed '/^[[:space:]]*$/d')"

          # Builds $1 from Dockerfile $2 under every tag, pushes it, prints the first ref.
          build_and_push() {
            local image="$1" dockerfile="$2" first='' args=()
            shift 2
            while IFS= read -r tag; do
              args+=(-t "$image:$tag")
              [ -z "$first" ] && first="$image:$tag"
            done <<< "$tags"
            docker build -f "$dockerfile" "${args[@]}" "$@" . >&2
            while IFS= read -r tag; do
              docker push "$image:$tag" >&2
            done <<< "$tags"
            printf '%s' "$first"
          }

          first="$(build_and_push "$KB_IMAGE" Dockerfile)"
          echo "image=$first" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$first\`." >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${KB_MCP_IMAGE:-}" ]; then
            exit 0
          fi

          # The index URL travels as a BuildKit secret: it may carry credentials,
          # and a build argument would be recorded in the image history.
          secret=()
          if [ -n "${KB_PYTHON_INDEX:-}" ]; then
            case "$KB_PYTHON_INDEX" in
              *[[:space:]]*|*@*)
                echo "::error::python-index must be a single URL without credentials; pass them as secrets"
                exit 1 ;;
              http://*|https://*) ;;
              *)
                echo "::error::python-index must be an http(s) URL, got '$KB_PYTHON_INDEX'"
                exit 1 ;;
            esac
            index="$KB_PYTHON_INDEX"
            if [ -n "${KB_PYTHON_INDEX_TOKEN:-}" ]; then
              user="$(jq -rn --arg v "${KB_PYTHON_INDEX_USERNAME:-__token__}" '$v|@uri')"
              token="$(jq -rn --arg v "$KB_PYTHON_INDEX_TOKEN" '$v|@uri')"
              index="${index%%://*}://${user}:${token}@${index#*://}"
            fi
            export KB_PYTHON_INDEX_URL="$index"
            secret=(--secret id=python-index,env=KB_PYTHON_INDEX_URL)
            echo "The MCP image installs from ${KB_PYTHON_INDEX}${KB_PYTHON_INDEX_TOKEN:+ (authenticated)}"
          fi

          mcp_first="$(build_and_push "$KB_MCP_IMAGE" mcp-server/Dockerfile "${secret[@]}")"
          echo "mcp-image=$mcp_first" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$mcp_first\`." >> "$GITHUB_STEP_SUMMARY"

      # kb-build.json records which release of which repo produced each app. An
      # image is opaque once pushed; this is how "the docs are wrong" becomes an
      # answerable question.
      - name: Upload the build provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kb-build-provenance
          path: knowledge-base/dist/kb-build.json
          if-no-files-found: warn
          retention-days: 90
