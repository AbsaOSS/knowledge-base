# CI checks — run on every PR and push to main.
#
# Jobs:
#   typecheck  — astro check (TypeScript / Astro type errors)
#   build      — full headless build (fetches app releases via GITHUB_TOKEN)
#   playwright — standalone Playwright tests against the preview server
#                (no data-gateway needed — covers web-fragment contract)
#
# Full integration tests (marketplace.spec.js) require a running data-gateway
# and are run locally. See playwright.config.js.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. TypeScript / Astro type-check ───────────────────────────────────────
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro type-check
        run: npx astro check

  # ── 2. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build (headless)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fetches release artifacts from apps.json repos (AbsaOSS public repos)
      # then builds the Astro site in headless/web-fragment mode.
      - name: Build marketplace (headless)
        run: npm run build:headless
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MP_HEADLESS: 'true'

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── 3. Playwright — standalone (no gateway) ────────────────────────────────
  #
  # Tests the fragment server directly on port 3000. Covers:
  #   - HTTP header safety  (X-Frame-Options must not block the gateway iframe)
  #   - Headless mode       (data-mp-headless, no chrome bar)
  #   - CSS link stability  (data-astro-transition-persist present — prevents #297)
  #   - Asset routing       (/__wf/knowledge-base/ rewrite via Astro preview plugin)
  #   - Client-side nav     (no full reload, URL updates via pushState)
  #
  playwright:
    name: Playwright (standalone)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run standalone tests
        run: npx playwright test --config=playwright.config.ci.js

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
