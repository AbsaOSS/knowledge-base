name: Publish docs to the knowledge base
description: >-
  Validate a repository's built headless documentation site against the
  knowledge base contract, pack it as kb-docs.tar.gz and attach it to a GitHub
  Release.
author: AbsaOSS

branding:
  icon: upload-cloud
  color: purple

inputs:
  manifest:
    description: >-
      Path to the repository's kb-docs.json, relative to the workspace. See
      contract/ARTIFACT.md for its shape.
    required: false
    default: kb-docs.json
  dist:
    description: >-
      The built headless output. When the manifest declares one app this is that
      app's directory; when it declares several, it is a directory holding one
      subdirectory per slug.
    required: false
    default: dist
  release-tag:
    description: >-
      Release to attach the artifact to. Defaults to the release that triggered
      the workflow, falling back to the repository's latest release.
    required: false
    default: ${{ github.event.release.tag_name }}
  github-token:
    description: >-
      Token used to upload the release asset. Needs `contents: write`.
    required: false
    default: ${{ github.token }}
  notify-repo:
    description: >-
      Optional `owner/name` of a deployment repository to notify once the
      artifact is published. Fires a `kb-docs-published` repository_dispatch so
      the deployment rebuilds without waiting for its schedule. Requires
      `notify-token`; skipped silently when either is unset.
    required: false
    default: ''
  notify-token:
    description: >-
      Token with `contents: write` on `notify-repo` only. The default
      `github.token` cannot dispatch to another repository.
    required: false
    default: ''

outputs:
  slugs:
    description: Comma-separated list of the slugs that were published.
    value: ${{ steps.build.outputs.slugs }}
  count:
    description: Number of apps in the published artifact.
    value: ${{ steps.build.outputs.count }}
  artifact:
    description: Absolute path of the packed kb-docs.tar.gz.
    value: ${{ steps.build.outputs.artifact }}
  release-tag:
    description: Tag of the release the artifact was uploaded to.
    value: ${{ steps.upload.outputs.release-tag }}

runs:
  using: composite
  steps:
    # The actions share one pinned dependency tree in actions/, so an onboarding
    # repo needs no toolchain, no package.json and no lockfile of its own.
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'

    - name: Install publisher dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm ci --omit=dev --no-audit --no-fund

    - name: Verify and pack the artifact
      id: build
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/index.js"
      env:
        KB_MANIFEST: ${{ github.workspace }}/${{ inputs.manifest }}
        KB_DIST: ${{ github.workspace }}/${{ inputs.dist }}
        KB_WORKSPACE: ${{ github.workspace }}
        KB_STAGE: ${{ runner.temp }}/kb-publish/stage
        KB_ARTIFACT: ${{ runner.temp }}/kb-publish/kb-docs.tar.gz

    - name: Upload kb-docs.tar.gz to the release
      id: upload
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        KB_RELEASE_TAG: ${{ inputs.release-tag }}
        KB_ARTIFACT: ${{ steps.build.outputs.artifact }}
        # Read through the environment, never interpolated into the script body:
        # a ${{ }} expression is substituted into the shell text before bash sees
        # it, so any metacharacter in the value would execute rather than quote
        # (#55). These come from the consuming repo's inputs.
        KB_COUNT: ${{ steps.build.outputs.count }}
        KB_SLUGS: ${{ steps.build.outputs.slugs }}
      run: |
        set -euo pipefail

        tag="${KB_RELEASE_TAG:-}"

        # /releases/latest excludes drafts and pre-releases, so fall back to the
        # most recently created release of any kind before giving up.
        if [ -z "$tag" ]; then
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
        fi
        if [ -z "$tag" ] || [ "$tag" = "null" ]; then
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].tag_name // empty' 2>/dev/null || true)"
        fi
        if [ -z "$tag" ] || [ "$tag" = "null" ]; then
          echo "::error::$GITHUB_REPOSITORY has no GitHub Release to attach the docs artifact to. Create a release (any tag) and re-run, or pass release-tag explicitly."
          exit 1
        fi

        echo "Uploading $(basename "$KB_ARTIFACT") to release $tag (replacing any existing asset)…"
        gh release upload "$tag" "$KB_ARTIFACT" --clobber --repo "$GITHUB_REPOSITORY"

        echo "release-tag=$tag" >> "$GITHUB_OUTPUT"
        echo "Published $KB_COUNT app(s): $KB_SLUGS" >> "$GITHUB_STEP_SUMMARY"

    - name: Notify the deployment repository
      if: ${{ inputs.notify-repo != '' && inputs.notify-token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.notify-token }}
        KB_NOTIFY_REPO: ${{ inputs.notify-repo }}
        KB_RELEASE_TAG: ${{ steps.upload.outputs.release-tag }}
        KB_SLUGS: ${{ steps.build.outputs.slugs }}
      run: |
        set -euo pipefail
        # A failed notify must not fail a successful publish: the artifact is
        # already on the release, and the deployment's schedule will pick it up.
        if gh api "repos/$KB_NOTIFY_REPO/dispatches" \
             --method POST \
             --field event_type=kb-docs-published \
             --field "client_payload[repo]=$GITHUB_REPOSITORY" \
             --field "client_payload[tag]=$KB_RELEASE_TAG" \
             --field "client_payload[slugs]=$KB_SLUGS"; then
          echo "Notified $KB_NOTIFY_REPO."
        else
          echo "::warning::Could not notify $KB_NOTIFY_REPO. The artifact was published; the deployment will pick it up on its next scheduled build."
        fi
