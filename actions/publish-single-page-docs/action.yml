name: Publish docs to the knowledge base
description: >-
  Render plain markdown files into headless single-page docs and publish them as
  a kb-docs.tar.gz bundle on this repository's latest GitHub Release, ready for the
  AbsaOSS knowledge base to pick up.
author: AbsaOSS

branding:
  icon: book-open
  color: purple

inputs:
  docs:
    description: >-
      YAML (or JSON) list of doc definitions. Each entry takes `md` (path to a
      markdown file, relative to the repository root), `title`, `description`
      and `slug` (lowercase kebab-case), plus optional `icon` and `tags`.
    required: true
  release-tag:
    description: >-
      Release to attach the bundle to. Defaults to the release that triggered the
      workflow, falling back to the repository's latest release.
    required: false
    default: ${{ github.event.release.tag_name }}
  github-token:
    description: >-
      Token used to upload the release asset. Needs `contents: write`.
    required: false
    default: ${{ github.token }}

outputs:
  slugs:
    description: Comma-separated list of the slugs that were published.
    value: ${{ steps.build.outputs.slugs }}
  count:
    description: Number of docs in the published bundle.
    value: ${{ steps.build.outputs.count }}
  artifact:
    description: Absolute path of the packed kb-docs.tar.gz.
    value: ${{ steps.build.outputs.artifact }}
  release-tag:
    description: Tag of the release the bundle was uploaded to.
    value: ${{ steps.upload.outputs.release-tag }}

runs:
  using: composite
  steps:
    # The actions share one pinned dependency tree in actions/, so an onboarding
    # repo needs no toolchain, no package.json and no lockfile of its own.
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'

    - name: Install publisher dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm ci --omit=dev --no-audit --no-fund

    - name: Render markdown and pack the bundle
      id: build
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/index.js"
      env:
        KB_DOCS: ${{ inputs.docs }}
        KB_WORKSPACE: ${{ github.workspace }}
        KB_STAGE: ${{ runner.temp }}/kb-single-page/stage
        KB_ARTIFACT: ${{ runner.temp }}/kb-single-page/kb-docs.tar.gz

    # Through the REST API, not the gh CLI: gh is preinstalled on GitHub-hosted
    # runners but is not part of the runner, and a self-hosted runner need not
    # have it. github-script brings its own Node and an authenticated
    # Octokit client, so this step assumes nothing about the machine it runs on.
    - name: Upload kb-docs.tar.gz to the release
      id: upload
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        KB_RELEASE_TAG: ${{ inputs.release-tag }}
        KB_ARTIFACT: ${{ steps.build.outputs.artifact }}
        # Read through the environment, never interpolated into the script body:
        # a ${{ }} expression is substituted into the script text before it is
        # parsed, so any metacharacter in the value would execute rather than
        # quote. These come from the consuming repo's `docs` input.
        KB_COUNT: ${{ steps.build.outputs.count }}
        KB_SLUGS: ${{ steps.build.outputs.slugs }}
        KB_RELEASE_LIB: ${{ github.action_path }}/../lib/release.cjs
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { publish } = require(process.env.KB_RELEASE_LIB);
          await publish({ github, core, context, env: process.env, noun: 'doc' });
