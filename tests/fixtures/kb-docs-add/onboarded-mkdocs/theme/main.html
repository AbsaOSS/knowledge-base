<!DOCTYPE html>
<html lang="en"{% if config.extra.headless %} data-kb-headless="true"{% endif %}>
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} - {{ config.site_name }}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ 'style.css' | url }}">
  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
</head>
<body>
  {% if not config.extra.headless %}
  <header class="topnav fixed top-0 inset-x-0">
    <a class="brand" href="{{ nav.homepage.url | url }}">{{ config.site_name }}</a>
    <nav>
      <a href="https://developer.example.com">Developer portal</a>
    </nav>
  </header>
  {% endif %}
  <nav id="sidebar">
    <ul>
    {% for nav_item in nav %}
      <li><a href="{{ nav_item.url | url }}">{{ nav_item.title }}</a></li>
    {% endfor %}
    </ul>
    <select id="version-picker" aria-label="Version"></select>
  </nav>
  <main id="content">
    <button class="copy-page" onclick="navigator.clipboard.writeText(document.getElementById('content').innerText)">Copy page</button>
    <button id="theme-toggle" aria-label="Toggle theme">◐</button>
    {{ page.content }}
  </main>
  <script src="{{ 'js/versions.js' | url }}"></script>
  <script src="{{ 'js/theme.js' | url }}"></script>
</body>
</html>
