# Shared response headers — CORS + security.
#
# WHY THIS IS A SEPARATE FILE
#
# nginx's `add_header` does not merge across configuration levels: a block that
# declares *any* add_header discards every add_header inherited from its parent.
# So a `location` that only wants to set Cache-Control silently drops the whole
# CORS and security header set declared at `server` level.
#
# Every block in nginx.conf that declares an add_header of its own therefore
# includes this file, and this file is the single place the shared set is
# defined. Adding a header here reaches every response; adding one directly to a
# location block instead is what causes the bug.
#
# Lives outside conf.d/ deliberately — nginx loads conf.d/*.conf as top-level
# server configuration, and this is a fragment, not a server block.

# ── CORS — required for web-fragment fetch from a different origin ────────────
# The fragment HTML is fetched cross-origin by the host app (e.g. localhost in
# dev, the data-gateway domain in production). Static content carries no
# credentials so a wildcard origin is safe here.
add_header Access-Control-Allow-Origin  "*"              always;
add_header Access-Control-Allow-Methods "GET, OPTIONS"   always;
add_header Access-Control-Allow-Headers "Content-Type, x-web-fragment-id, x-fragment-mode" always;

# ── Security ─────────────────────────────────────────────────────────────────
# X-Frame-Options stays SAMEORIGIN rather than DENY: web-fragments isolates the
# fragment's JS context in a hidden iframe, and DENY blocks it — the fragment
# then fails to load with no error. Asserted in tests/standalone.spec.js.
add_header X-Content-Type-Options  "nosniff"         always;
add_header X-Frame-Options         "SAMEORIGIN"      always;
add_header Referrer-Policy         "strict-origin"   always;

# Deliberately NOT set: X-XSS-Protection. The legacy XSS auditor is gone from
# every current browser, and the header has a history of introducing
# vulnerabilities rather than preventing them. Content-Security-Policy below is
# the replacement.

# ── Content-Security-Policy ──────────────────────────────────────────────────
#
# Defence in depth behind the publish-time sanitiser: doc HTML comes from other
# repositories' release artifacts and is re-hosted on this origin next to every
# other doc, so a bypass of the sanitiser must not become script execution.
#
# script-src 'self' with no 'unsafe-inline' is the point of the whole policy, and
# it only holds because nothing inline survives into dist/:
#   • the publishing action ships its mermaid init as assets/mermaid-init.js
#   • scripts/hoist-inline-scripts.js moves any inline <script> in a sub-app
#     artifact into a file at build time, which is what keeps bundles published
#     before that change working
# Adding an inline <script> anywhere breaks the page rather than the policy —
# tests/build-integrity.spec.js fails the build first.
#
# style-src keeps 'unsafe-inline'. Base.astro's @layer ordering fix, the
# shadow-DOM compat styles and sub-app style= attributes are all inline, and CSS
# is a far weaker injection primitive than script. Tightening it means hashing
# or hoisting styles the same way — worth doing, not worth blocking this on.
#
# style-src and font-src are otherwise 'self': Inter is served from this origin
# (#54), so no third-party font host needs allowlisting. font-src keeps data:
# for sub-app CSS that inlines a face.
#
# frame-src allows https: because `type: "iframe"` registry entries embed
# arbitrary external documentation sites; blob: is for the web-fragments
# reframing iframe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https: blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
